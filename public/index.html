<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Purchase Ledger 300 Limited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  :root{
    --primary:#1E3A8A; --primary-dark:#0B2159; --primary-light:#3D5FD1;
    --secondary:#0D9488; --gold:#B8873A;
    --on-surface:#101828; --on-surface-var:#586279;
    --error:#B3261E; --error-container:#F9DEDC;
    --glass-bg:rgba(255,255,255,.65); --glass-border:rgba(255,255,255,.8);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Roboto',sans-serif;color:var(--on-surface);
    background:
      radial-gradient(circle at 10% 6%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 30%),
      radial-gradient(circle at 90% 12%, rgba(184,135,58,.16) 0%, rgba(184,135,58,0) 34%),
      radial-gradient(circle at 88% 78%, rgba(13,148,136,.14) 0%, rgba(13,148,136,0) 36%),
      linear-gradient(165deg, #F2F5FC 0%, #E7ECF8 38%, #DCE3F4 72%, #D3DCF1 100%);
  }
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;line-height:1;}
  .card{
    width:100%;max-width:380px;background:var(--glass-bg);backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);
    border-radius:22px;box-shadow:0 20px 44px rgba(11,33,89,.22);padding:36px 32px;
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:26px;}
  .brand .icon-badge{
    width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg, var(--primary-light), var(--primary-dark));color:#fff;
    box-shadow:0 8px 20px rgba(11,33,89,.35);
  }
  .brand .icon-badge .material-symbols-outlined{font-size:28px;}
  .brand .eyebrow{font-size:11px;letter-spacing:.08em;color:var(--gold);font-weight:600;margin-top:6px;}
  .brand h1{margin:2px 0 0;font-size:19px;font-weight:700;text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11.5px;font-weight:500;color:var(--on-surface-var);margin-bottom:6px;}
  .field input{
    width:100%;font-family:'Roboto',sans-serif;font-size:14px;padding:12px 14px;
    border:none;border-bottom:2px solid rgba(16,33,89,.15);background:rgba(255,255,255,.6);
    border-radius:10px 10px 0 0;color:var(--on-surface);
  }
  .field input:focus{outline:none;border-bottom:2px solid var(--primary);background:rgba(255,255,255,.9);}
  .btn{
    width:100%;padding:13px;border:none;border-radius:100px;font-weight:600;font-size:14px;cursor:pointer;
    background:linear-gradient(160deg, var(--secondary) 0%, #0B7A70 100%);color:#fff;
    box-shadow:0 8px 20px rgba(13,148,136,.4);margin-top:6px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:disabled{opacity:.6;cursor:default;}
  .error{
    margin-top:14px;background:var(--error-container);color:var(--error);font-size:12.8px;
    padding:10px 14px;border-radius:10px;display:none;
  }
  .error.show{display:block;}
  .foot{margin-top:22px;text-align:center;font-size:11px;color:var(--on-surface-var);}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="icon-badge"><span class="material-symbols-outlined">receipt_long</span></div>
    <div class="eyebrow">300 LIMITED · PROCUREMENT ANALYTICS</div>
    <h1>Purchase Ledger Dashboard</h1>
  </div>

  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="loginBtn">
      <span class="material-symbols-outlined" style="font-size:18px;">login</span>
      Sign in
    </button>
    <div class="error" id="loginError"></div>
  </form>

  <div class="foot">Contact your admin if you don't have login credentials.</div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  btn.disabled = true;

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, password })
    });
    const json = await res.json();
    if(!res.ok) throw new Error(json.error || 'Login failed');
    window.location.href = json.role === 'admin' ? '/admin' : '/dashboard';
  }catch(err){
    errEl.textContent = err.message;
    errEl.classList.add('show');
    btn.disabled = false;
  }
});

/* If already logged in, skip straight to dashboard */
(async function(){
  try{
    const res = await fetch('/api/me');
    if(res.ok){
      const me = await res.json();
      window.location.href = me.role === 'admin' ? '/admin' : '/dashboard';
    }
  }catch(e){}
})();
</script>
</body>
</html>
